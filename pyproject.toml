[project]
name = "screening"
version = "0.1.0"
description = "Resume Screening and Candidate Recommendation"
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.3",
    "pydantic>=2",
    "pypdf>=6.16.1",
]

[project.scripts]
screening = "screening.cli:main"
screening-web = "screening.web:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=8",
]
data = [
    "pyarrow>=17",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
